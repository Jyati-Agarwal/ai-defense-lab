$schema: https://json-schema.org/draft/2020-12/schema
title: AI Defense Lab attack specification
type: object
additionalProperties: false
required:
  - id
  - name
  - tier
  - description
  - kill_chain_stage
  - channel
  - rail
  - genai_capability
  - primitives
  - observable_signals
  - defense_hooks
  - severity
  - feasibility_today
properties:
  id:
    type: string
    pattern: ^GPF-[AC][0-9]{2}$
  name:
    type: string
    minLength: 8
  tier:
    enum: [classic, agentic]
  description:
    type: string
    minLength: 24
  kill_chain_stage:
    enum:
      - reconnaissance
      - context_manip
      - intent_manip
      - tool_manip
      - merchant_manip
      - payment_manip
      - delayed_exec
      - cash_out
  channel:
    enum: [agentic_checkout, card_ecom, upi_p2p, upi_collect, wire]
  rail:
    enum: [card, upi, wire]
  genai_capability:
    type: string
    minLength: 2
  primitives:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - reconnaissance
        - context_manip
        - intent_manip
        - tool_manip
        - merchant_manip
        - payment_manip
        - delayed_exec
        - cash_out
  observable_signals:
    type: array
    minItems: 2
    uniqueItems: true
    items:
      type: string
      minLength: 6
  defense_hooks:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 6
  severity:
    enum: [low, medium, high, critical]
  feasibility_today:
    type: boolean

