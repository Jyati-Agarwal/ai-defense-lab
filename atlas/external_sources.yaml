schema_version: 1
purpose: sealed evaluation-only crosswalk; taxonomy metadata and abstract outcomes only
safety:
  watermark: SAFE ABSTRACT EFFECT / NON-OPERATIONAL
  raw_payloads_included: false
  attacker_identifiers_included: false
  evaluation_only: true

fidelity_definitions:
  exact: a concrete repository generator implements the local atlas vector; this does not claim reproduction of an external benchmark
  behavioral_proxy: only declared observable effects are represented and scored; the omitted mechanism is stated per vector
  unsupported: required telemetry or lifecycle state is absent; the case is retained but never scored

